<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stormlight EPUB Reader</title>

<!-- EPUB.js -->
<script src="https://unpkg.com/epubjs/dist/epub.min.js"></script>

<!-- Firebase (compat for simplicity) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #0a0f1c, #02040a);
  color: #d6eaff;
  font-family: Georgia, serif;
  overflow: hidden;
}

/* Top bar */
#topbar {
  height: 50px;
  background: rgba(0,0,0,0.6);
  border-bottom: 1px solid rgba(0,200,255,0.3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  color: #9be7ff;
}

/* File input */
#fileInput {
  background: transparent;
  color: #9be7ff;
}

/* Viewer */
#viewer {
  height: calc(100vh - 50px);
}

/* Glow container */
.epub-container {
  box-shadow: 0 0 20px rgba(0,200,255,0.3);
  border: 1px solid rgba(0,200,255,0.2);
  border-radius: 10px;
  animation: glowPulse 3s infinite alternate;
}

/* Highlight */
.highlight {
  background: rgba(0,200,255,0.3);
  box-shadow: 0 0 8px rgba(0,200,255,0.8);
}

/* Popup */
#popup {
  position: absolute;
  background: #0b132b;
  border: 1px solid #00cfff;
  padding: 10px;
  border-radius: 8px;
  display: none;
  z-index: 999;
}

#popup textarea {
  width: 200px;
  height: 60px;
  background: #02040a;
  color: white;
  border: 1px solid #00cfff;
}

#popup button {
  margin-top: 5px;
  background: #00cfff;
  border: none;
  padding: 5px;
  cursor: pointer;
}

/* Glow animation */
@keyframes glowPulse {
  from { box-shadow: 0 0 10px rgba(0,200,255,0.2); }
  to { box-shadow: 0 0 25px rgba(0,200,255,0.6); }
}
</style>
</head>

<body>

<div id="topbar">
  <span>🌩️ Stormlight Reader</span>
  <input type="file" id="fileInput" accept=".epub">
</div>

<div id="viewer"></div>

<div id="popup">
  <textarea id="note" placeholder="Add annotation..."></textarea><br>
  <button onclick="saveNote()">Save</button>
</div>

<script>
// 🔥 FIREBASE CONFIG (REPLACE THIS)
/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAnGTs4BOpOxSVk6mQqjn7xqc0-aNKaT0k",
  authDomain: "stonewards-14b2c.firebaseapp.com",
  databaseUrl: "https://stonewards-14b2c-default-rtdb.firebaseio.com/",
  projectId: "stonewards-14b2c",
  storageBucket: "stonewards-14b2c.firebasestorage.app",
  messagingSenderId: "787961212659",
  appId: "1:787961212659:web:2af6287879b1c3d3d81186"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// GLOBALS
let book, rendition;
let selectedCfi = null;
let currentBookId = null;

// 📂 HANDLE EPUB UPLOAD
document.getElementById("fileInput").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

  currentBookId = file.name;

  const reader = new FileReader();

  reader.onload = function(event) {
    const arrayBuffer = event.target.result;

    // Load book
    book = ePub(arrayBuffer);

    // Clear previous viewer
    document.getElementById("viewer").innerHTML = "";

    rendition = book.renderTo("viewer", {
      width: "100%",
      height: "100%"
    });

    rendition.display();

    setupReaderEvents();
    loadAnnotations();
  };

  reader.readAsArrayBuffer(file);
});

// ✨ SETUP EVENTS
function setupReaderEvents() {
  rendition.on("selected", (cfiRange, contents) => {
    selectedCfi = cfiRange;

    const selection = contents.window.getSelection();
    const range = selection.getRangeAt(0);
    const rect = range.getBoundingClientRect();

    const popup = document.getElementById("popup");

    popup.style.top = (rect.top + window.scrollY) + "px";
    popup.style.left = (rect.left + window.scrollX) + "px";
    popup.style.display = "block";
  });
}

// 💬 SAVE NOTE
function saveNote() {
  if (!selectedCfi || !rendition || !currentBookId) return;

  const text = document.getElementById("note").value;

  db.ref("annotations/" + currentBookId).push({
    cfi: selectedCfi,
    note: text,
    user: "user1",
    timestamp: Date.now()
  });

  // Add highlight locally
  rendition.annotations.add(
    "highlight",
    selectedCfi,
    {},
    null,
    "highlight"
  );

  document.getElementById("popup").style.display = "none";
  document.getElementById("note").value = "";
}

// 👥 LOAD REAL-TIME ANNOTATIONS
function loadAnnotations() {
  if (!currentBookId) return;

  db.ref("annotations/" + currentBookId).off(); // prevent duplicates

  db.ref("annotations/" + currentBookId).on("child_added", snapshot => {
    const data = snapshot.val();

    if (rendition) {
      rendition.annotations.add(
        "highlight",
        data.cfi,
        {},
        null,
        "highlight"
      );
    }
  });
}

// Hide popup when clicking outside
document.addEventListener("click", (e) => {
  if (!e.target.closest("#popup")) {
    document.getElementById("popup").style.display = "none";
  }
});
</script>

</body>
</html>
