<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stormlight Reader</title>

<script src="https://unpkg.com/epubjs/dist/epub.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #0a0f1c, #02040a);
  color: #d6eaff;
  font-family: Georgia, serif;
}

/* Center screens */
.center-screen {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Hidden */
.hidden { display: none; }

/* Inputs */
input {
  display: block;
  margin: 10px;
  padding: 8px;
  background: #02040a;
  color: white;
  border: 1px solid #00cfff;
}

/* Button */
button {
  background: #00cfff;
  border: none;
  padding: 8px;
  cursor: pointer;
}

/* Topbar */
#topbar {
  height: 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 15px;
  border-bottom: 1px solid rgba(0,200,255,0.3);
}

/* Viewer */
#viewer {
  height: calc(100vh - 50px);
}

/* Highlights */
.highlight-user1 { background: rgba(0,200,255,0.3); }
.highlight-user2 { background: rgba(255,100,200,0.3); }

/* Popup */
#popup, #comments {
  position: absolute;
  background: #0b132b;
  border: 1px solid #00cfff;
  padding: 10px;
  border-radius: 8px;
  display: none;
  z-index: 999;
}
</style>
</head>

<body>

<!-- 🔒 SITE PASSWORD -->
<div id="siteGate" class="center-screen">
  <div>
    <h2>Enter Site Password</h2>
    <input type="password" id="sitePass">
    <button onclick="checkSite()">Enter</button>
  </div>
</div>

<!-- 👤 LOGIN -->
<div id="loginScreen" class="center-screen hidden">
  <div>
    <h2>Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- 📖 APP -->
<div id="app" class="hidden">
  <div id="topbar">
    <span>🌩️ Stormlight Reader</span>
    <input type="file" id="fileInput" accept=".epub">
  </div>

  <div id="viewer"></div>

  <div id="popup">
    <textarea id="note"></textarea>
    <button onclick="saveNote()">Save</button>
  </div>

  <div id="comments"></div>
</div>

<script>
// 🔥 CONFIG
const SITE_PASSWORD = "stormlight"; // change this

const USERS = {
  "kaladin": "windrunner",
  "shallan": "lightweaver"
};

// Firebase
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "...",
  databaseURL: "...",
  projectId: "...",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔒 SITE GATE
function checkSite() {
  const val = document.getElementById("sitePass").value;
  if (val === SITE_PASSWORD) {
    document.getElementById("siteGate").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");
  } else {
    alert("Wrong password");
  }
}

// 👤 LOGIN
let username = null;
let userColor = null;

function login() {
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  if (USERS[u] === p) {
    username = u;
    userColor = "highlight-" + (Math.random() > 0.5 ? "user1" : "user2");

    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  } else {
    alert("Invalid login");
  }
}

// EPUB + DATA
let book, rendition;
let selectedCfi = null;
let currentBookId = null;

// Upload
document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  currentBookId = file.name;

  const reader = new FileReader();
  reader.onload = ev => {
    book = ePub(ev.target.result);
    document.getElementById("viewer").innerHTML = "";

    rendition = book.renderTo("viewer", { width:"100%", height:"100%" });
    rendition.display();

    setupEvents();
    loadAnnotations();
    restorePosition();
  };
  reader.readAsArrayBuffer(file);
});

// EVENTS
function setupEvents() {
  rendition.on("selected", (cfi, contents) => {
    selectedCfi = cfi;

    const rect = contents.window.getSelection()
      .getRangeAt(0).getBoundingClientRect();

    const popup = document.getElementById("popup");
    popup.style.top = rect.top + "px";
    popup.style.left = rect.left + "px";
    popup.style.display = "block";
  });

  rendition.on("click", e => {
    if (e.target.className.includes("highlight")) {
      showComments(e.target.getAttribute("data-cfi"), e);
    }
  });

  rendition.on("relocated", loc => {
    db.ref("positions/"+currentBookId+"/"+username)
      .set(loc.start.cfi);
  });
}

// SAVE NOTE
function saveNote() {
  const text = document.getElementById("note").value;

  db.ref("annotations/"+currentBookId).push({
    cfi: selectedCfi,
    note: text,
    user: username,
    color: userColor
  });

  rendition.annotations.add("highlight", selectedCfi,
    {"data-cfi": selectedCfi}, null, userColor);

  document.getElementById("popup").style.display="none";
}

// LOAD ANNOTATIONS
function loadAnnotations() {
  db.ref("annotations/"+currentBookId).off();

  db.ref("annotations/"+currentBookId).on("child_added", snap=>{
    const d = snap.val();
    rendition.annotations.add("highlight", d.cfi,
      {"data-cfi": d.cfi}, null, d.color);
  });
}

// COMMENTS
function showComments(cfi, e) {
  const box = document.getElementById("comments");
  box.innerHTML="Loading...";
  box.style.display="block";
  box.style.top=e.clientY+"px";
  box.style.left=e.clientX+"px";

  db.ref("annotations/"+currentBookId)
    .orderByChild("cfi").equalTo(cfi)
    .once("value", snap=>{
      box.innerHTML="";
      snap.forEach(c=>{
        const d=c.val();
        box.innerHTML+=`<div><b>${d.user}</b>: ${d.note}</div>`;
      });
    });
}

// RESTORE POSITION
function restorePosition() {
  db.ref("positions/"+currentBookId+"/"+username)
    .once("value", snap=>{
      if(snap.exists()) rendition.display(snap.val());
    });
}

// Hide popups
document.addEventListener("click", e=>{
  if(!e.target.closest("#popup") && !e.target.closest("#comments")){
    document.getElementById("popup").style.display="none";
    document.getElementById("comments").style.display="none";
  }
});
</script>

</body>
</html>
